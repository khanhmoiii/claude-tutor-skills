<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="960" height="260" rx="18" fill="url(#bg)"/>
  <!-- terminal card -->
  <g transform="translate(600 46)">
    <rect width="320" height="168" rx="10" fill="#0f172a" stroke="#6366f1" stroke-opacity="0.5"/>
    <circle cx="18" cy="16" r="5" fill="#f87171"/><circle cx="34" cy="16" r="5" fill="#fbbf24"/><circle cx="50" cy="16" r="5" fill="#34d399"/>
    <g font-family="Consolas, Menlo, monospace" font-size="13">
