    <rect x="202" y="192" width="74" height="28" rx="14" fill="#7c3aed"/><text x="239" y="211" text-anchor="middle">/debug</text>
    <rect x="284" y="192" width="40" height="28" rx="14" fill="#7c3aed"/><text x="304" y="211" text-anchor="middle">/r</text>
