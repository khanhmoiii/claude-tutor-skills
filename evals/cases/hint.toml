# /hint — thang gợi ý. Lỗi cài sẵn: cart.py dùng range(1, len(items)).

[[case]]
id = "hint-new-escalate"
context = "cart.py: bug is `for i in range(1, len(items))`, which skips index 0 (the 100-priced book), so it prints 20.0 instead of 120.0. Fix: range(len(items))."
turns = ["/hint cart.py in ra 20.0 nhưng tôi mong đợi 120.0, tôi không hiểu sao", "/hint"]
checks = [
  { id = "H1", type = "regex", turn = 1, pattern = 'cấp 0\s*/\s*6' },
  { id = "H2", type = "regex", turn = 2, pattern = 'cấp 1\s*/\s*6' },
  { id = "H4", type = "no_code_block", turn = 1, critical = true },
  { id = "H4", type = "no_code_block", turn = 2, critical = true },
  { id = "H5", type = "judge", turn = 1, critical = true, question = "Does the reply AVOID pointing to where the bug is? Fail if it names or hints at the loop, range(), indices, the starting index, a specific line, or the specific expression involved in the bug. Asking about observable results (e.g. which item's price equals 20.0, which items were summed) is allowed." },
  { id = "H6", type = "judge", turn = 2, question = "Does the reply name a general concept (e.g. list indexing / iterating over indices) WITHOUT revealing the exact faulty code or the fix (it must not say range(len(items)), 'start the loop at 0', or quote the faulty line)?" },
  { id = "H9", type = "regex", turn = 1, pattern = '👉' },
  { id = "H9", type = "regex", turn = 1, pattern = '/hint' },
  { id = "X1", type = "judge", turn = 1, question = "Does the reply avoid giving the solution (corrected code, or an explicit statement of what to change)?" },
  { id = "X2", type = "max_count", turn = 1, pattern = '\?', max = 3 },
  { id = "X3", type = "not_regex", turn = 1, pattern = '(sẽ|mình|tôi)\s+(không|chưa)\s+(nói|tiết lộ|đưa)\s+(ngay|luôn|đáp án|lời giải)|để bạn tự (tìm|khám phá)|tự tìm (thì|sẽ) nhớ' },
  { id = "X4", type = "regex", turn = 1, pattern = '[ăâđêôơưạảấầậắằặẹẻẽếềệịọỏốồộớờợụủứừựỳ]' },
]

